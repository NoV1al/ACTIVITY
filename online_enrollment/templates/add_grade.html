<h2 class="grade-title">Add Grade</h2>

<div class="form-wrapper">
    <form method="POST" class="grade-form">
        {% csrf_token %}
        
        <div class="form-fields">
            {{ form.as_p }}
        </div>

        <button type="submit" class="btn-save">Save</button>
    </form>
</div>

<style>
    /* Center the form box */
    .form-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        margin-top: 30px;
    }

    .grade-title {
        text-align: center;
        font-family: Arial, sans-serif;
        margin-bottom: 10px;
        color: #5a3e1b;
    }

    /* Form container */
    .grade-form {
        width: 100%;
        max-width: 420px;
        padding: 28px;
        border: 1px solid #f0e6d2;
        border-radius: 14px;
        background: #fff8e7;
        font-family: Arial, sans-serif;
        box-shadow: 0 6px 16px rgba(0,0,0,0.08);
        animation: fadeIn 0.4s ease-out;
    }

    /* Fade-in animation */
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* Field spacing */
    .grade-form p {
        margin-bottom: 18px;
    }

    /* Input styling */
    .grade-form input,
    .grade-form select,
    .grade-form textarea {
        width: 100%;
        padding: 11px;
        margin-top: 6px;
        border: 1px solid #e0d6c0;
        border-radius: 8px;
        background: #fffef5;
        font-size: 15px;
        transition: all 0.2s ease;
    }

    .grade-form input:focus,
    .grade-form select:focus,
    .grade-form textarea:focus {
        border-color: #d8b57c;
        outline: none;
        box-shadow: 0 0 4px rgba(216,181,124,0.4);
    }

    /* Save button */
    .btn-save {
        background: #f5d6a0;
        color: #5a3e1b;
        padding: 12px 0;
        width: 100%;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        cursor: pointer;
        transition: all 0.3s ease;
        font-weight: bold;
    }

    .btn-save:hover {
        background: #f0cc8a;
    }
</style>
