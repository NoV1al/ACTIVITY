{% block content %}
<div class="profile-container">
    <h2>{{ student.stu_name }}'s Profile</h2>

    <div class="profile-info">
        <p><strong>Student ID:</strong> {{ student.stu_id }}</p>
        <p><strong>Name:</strong> {{ student.stu_name }}</p>
        <p><strong>Email:</strong> {{ student.stu_email }}</p>
        <p><strong>Contact:</strong> {{ student.stu_con }}</p>
        <p><strong>Password:</strong> {{ student.stu_pass }}</p>
    </div>

    <div class="btn-group">
        <a href="{% url 'student_edit' student.stu_id %}" class="btn-edit">Edit</a>
        <a href="{% url 'student_logout' %}" class="btn-back">Logout</a>
    </div>
</div>

<style>
  * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }

  body {
      margin: 0;
      background: #eef1f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
  }

  .profile-container {
      background: #ffffff;
      padding: 36px;
      border-radius: 12px;
      width: 420px;
      text-align: center;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
      border: 1px solid #d4d9e2;
  }

  h2 {
      margin-bottom: 20px;
      font-weight: 700;
      color: #1a2a3a;
  }

  .profile-info p {
      font-size: 16px;
      margin: 10px 0;
      color: #3a4b5c;
  }

  .btn-group {
      margin-top: 24px;
      display: flex;
      justify-content: center;
      gap: 14px;
  }

  .btn-edit, .btn-back {
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 700;
      text-decoration: none;
      transition: 0.2s ease;
  }

  .btn-edit {
      background: #3a6ea5;
      color: white;
  }

  .btn-edit:hover {
      background: #2f5a87;
  }

  .btn-back {
      background: #d4d9e2;
      color: #1a2a3a;
  }

  .btn-back:hover {
      background: #c2c7d0;
  }
</style>
{% endblock %}
