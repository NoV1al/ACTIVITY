{% block content %}
<div class="register-container">
    <h2>Student Register</h2>

    {% for message in messages %}
        <div class="message">{{ message }}</div>
    {% endfor %}

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-submit">Register</button>
    </form>

    <p class="login-link">Already have an account? <a href="{% url 'student_login' %}">Login Here</a></p>
</div>

<style>
  * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }

  body {
      margin: 0;
      background: #eef1f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
  }

  .register-container {
      background: #ffffff;
      padding: 36px;
      border-radius: 12px;
      width: 400px;
      text-align: center;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
      border: 1px solid #d4d9e2;
  }

  h2 {
      margin: 0 0 18px;
      font-weight: 700;
      color: #1a2a3a;
  }

  input[type="text"], input[type="email"], input[type="number"], input[type="password"] {
      width: 100%;
      padding: 12px 15px;
      margin: 12px 0 20px;
      border: 1px solid #c2c7d0;
      border-radius: 8px;
      background: #f9fbfd;
      font-weight: 600;
      color: #1a2a3a;
      transition: 0.2s ease;
  }

  input:focus {
      border-color: #3a6ea5;
      background: #ffffff;
      outline: none;
      box-shadow: 0 0 0 3px rgba(58,110,165,0.15);
  }

  .btn-submit {
      width: 100%;
      padding: 12px;
      background: #3a6ea5;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s ease;
  }

  .btn-submit:hover {
      background: #2f5a87;
  }

  .login-link {
      margin-top: 16px;
      color: #3a4b5c;
      font-weight: 500;
  }

  .login-link a {
      color: #3a6ea5;
      font-weight: 700;
      text-decoration: none;
  }

  .login-link a:hover {
      text-decoration: underline;
  }

  .message {
      background: #e8f1ff;
      color: #244b74;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 16px;
      border: 1px solid #cddcf0;
      font-weight: 600;
  }
</style>
{% endblock %}
